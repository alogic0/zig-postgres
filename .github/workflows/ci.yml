name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read pinned Zig version
        id: zig
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - name: Check formatting, build consumers, and run offline tests
        run: zig build ci -j4 --summary all
      - name: Build the README consumer from an archive with fresh caches
        run: zig build check-package -j4 --summary all
