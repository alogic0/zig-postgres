name: PostgreSQL live acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  live:
    # Provision Zig 0.17.0, Docker, OpenSSL 3 and the openssl CLI on this runner.
    runs-on: [self-hosted, linux, x64, zig-0.17.0]
    timeout-minutes: 20 # compilation + 600 s run + independent 30 s cleanup
    strategy:
      fail-fast: false
      matrix:
        optimize: [debug, safe]
        tls: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: zig build ci -j4 --summary all
      - run: zig build test-live -Doptimize=${{ matrix.optimize }} -Dtls=${{ matrix.tls }} -j4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: postgres-${{ matrix.optimize }}-${{ matrix.tls }}
          path: zig-out/live-*.json
  controls:
    runs-on: [self-hosted, linux, x64, zig-0.17.0]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: zig build test-live-controls -j4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-owner-controls
          path: zig-out/live-controls.json
