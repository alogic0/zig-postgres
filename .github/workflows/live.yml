name: PostgreSQL live acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # compilation + 600 s run + independent 30 s cleanup
    strategy:
      fail-fast: false
      matrix:
        optimize: [debug, safe]
        tls: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read pinned Zig version
        id: zig
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - run: zig build test-live -Doptimize=${{ matrix.optimize }} -Dtls=${{ matrix.tls }} -j4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: postgres-${{ matrix.optimize }}-${{ matrix.tls }}
          path: zig-out/live-*.json
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read pinned Zig version
        id: zig
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - run: zig build test-live-controls -j4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-owner-controls
          path: zig-out/live-controls.json
